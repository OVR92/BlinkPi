# Example Home Assistant gallery-card config for browsing clips synced
# by blink-usb-bridge. Assumes you've added your SMB share as a network
# storage source in HA (Settings → System → Storage → Add network storage)
# with usage type "Media".
#
# Replace `kitchen_blink` with the name you gave your network storage,
# and the camera folder names with your camera names.
#
# Requires the gallery-card custom card from HACS:
#   https://github.com/TarheelGrad1998/gallery-card

type: custom:gallery-card
title: Driveway
entities:
  - path: media-source://media_source/kitchen_blink/Driveway/
file_name_format: YYYY-MM-DD_HH-mm-ss
caption_format: MMM D h:mm:ss A
maximum_files: 50
video_preload: true
preview_picture_time: 5
menu_alignment: bottom

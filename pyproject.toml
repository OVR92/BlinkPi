[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-usb-bridge"
version = "0.1.0"
description = "Relay Blink Sync Module 2 motion clips to local or cloud storage via a Pi presenting USB mass storage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "blink-usb-bridge contributors" },
]
keywords = ["blink", "sync-module", "raspberry-pi", "usb-gadget", "smart-home"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: System :: Archiving",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.1",
]

[project.scripts]
bub-sync = "blink_usb_bridge.sync:main"
bub-wipe = "blink_usb_bridge.wipe:main"
bub-prune = "blink_usb_bridge.prune:main"

[project.urls]
Homepage = "https://github.com/CHANGEME/blink-usb-bridge"
Issues = "https://github.com/CHANGEME/blink-usb-bridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
